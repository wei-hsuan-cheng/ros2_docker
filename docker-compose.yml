# The ros_jazzy container, with GPU access.
#
#   docker compose build              # = docker build -t ros_jazzy .
#   docker compose up -d              # create and start the container
#   docker compose exec ros_jazzy bash
#
# NVIDIA GPU: add the override file, see docker-compose.nvidia.yml.
services:
  ros_jazzy:
    build:
      context: .
      args:
        # true: Mesa 24.0.5 for a virgl GPU (Parallels). false: Ubuntu's latest Mesa.
        PIN_MESA_FOR_VIRGL: ${PIN_MESA_FOR_VIRGL:-true}
    image: ros_jazzy
    container_name: ros_jazzy
    command: bash
    stdin_open: true   # -i
    tty: true          # -t
    privileged: true
    # Mesa hands rendered frames to the X server through shared memory (MIT-SHM),
    # which needs the host's IPC namespace; without it rviz/MuJoCo windows are black.
    ipc: host
    network_mode: bridge   # docker run's default network, not a per-project one
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      XAUTHORITY: /tmp/.docker.xauth
    volumes:
      # Code edited on the Mac (Parallels shares ~/src as /media/psf/Home/src).
      # Elsewhere set SRC_DIR, e.g. SRC_DIR=$HOME/src docker compose up -d
      - ${SRC_DIR:-/media/psf/Home/src}:/root/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth
    # GPU: privileged exposes the host's /dev/dri (when it has one) to Mesa - virgl on
    # a Parallels VM, the native driver on an Intel/AMD PC. NVIDIA: see
    # docker-compose.nvidia.yml.
