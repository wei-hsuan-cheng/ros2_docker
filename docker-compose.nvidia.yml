# NVIDIA GPU, on a host with an NVIDIA driver and the NVIDIA Container Toolkit:
#
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
services:
  ros_jazzy:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
